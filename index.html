<!doctype html>
<html lang="nl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#182c28"><title>Corrie Fay — cultuur voor ons</title>
<style>
:root{font-family:system-ui,-apple-system,sans-serif;color:#20332e;background:#f7f6f0}*{box-sizing:border-box}body{margin:0}.wrap{max-width:650px;margin:auto;padding:20px 16px 96px}header{display:flex;justify-content:space-between;align-items:center}h1{font-family:Georgia,serif;font-size:34px;margin:12px 0 4px}small,.muted{color:#63716c}.chip{border:1px solid #d6ded9;border-radius:30px;padding:9px 14px;background:white;cursor:pointer}.chip.active{background:#203b33;color:white}nav{display:flex;gap:7px;overflow:auto;padding:18px 0}.card{background:white;border:1px solid #e4e8e2;border-radius:18px;overflow:hidden;margin:0 0 17px;box-shadow:0 3px 12px #12291d0a}.art{height:125px;display:grid;place-items:center;font-size:52px;background:linear-gradient(125deg,#d6e9dc,#e5d6bf)}.inner{padding:16px}.top{display:flex;justify-content:space-between;align-items:center}.tag{font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:#476d5c}h2{font-family:Georgia,serif;font-size:23px;margin:10px 0 7px}p{line-height:1.5}.heart{border:0;background:#f1f4f0;border-radius:50%;width:42px;height:42px;font-size:22px;cursor:pointer}.heart.on{color:#c14465}.link{color:#23664b;font-weight:650}.bottom{position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid #e2e6e0;display:flex;justify-content:center;gap:25px;padding:13px}.bottom button{border:0;background:none;font-size:15px;cursor:pointer}.notice{background:#fff4db;border-radius:12px;padding:12px;font-size:13px;margin:12px 0}
</style></head><body><main class="wrap"><header><div><h1>Corrie Fay</h1><small>Jullie persoonlijke cultuuragenda</small></div><span style="font-size:34px">✦</span></header><div class="notice">Echte agenda-items, gecontroleerd op 15 november 2026. Controleer speeldata en tickets bij de organisator. Favorieten zijn voorlopig lokaal; gedeelde synchronisatie volgt.</div><nav id="filters"></nav><section id="cards"></section></main><div class="bottom"><button onclick="setView('all')">⌂ Ontdekken</button><button onclick="setView('saved')">♡ Bewaard</button></div>
<script>
const sample=[
{id:'d1',cat:'Dans',emoji:'💃',title:'Nieuwe perspectieven in dans',where:'Amsterdam',date:'Voorbeeld',desc:'Een verrassende hedendaagse dansavond. Deze kaart demonstreert hoe Corrie Fay een voorstelling zou aanbevelen.'},
{id:'m1',cat:'Concert',emoji:'🎷',title:'Een intiem jazzconcert',where:'Amsterdam',date:'Voorbeeld',desc:'Een sfeervolle avond met vernieuwende jazz en ruimte voor improvisatie.'},
{id:'c1',cat:'Cabaret',emoji:'🎭',title:'Scherpe verhalen op het podium',where:'Diemen',date:'Voorbeeld',desc:'Kleinschalig cabaret met humor en maatschappijkritiek.'},
{id:'f1',cat:'Film',emoji:'🎬',title:'Bijzondere arthousefilm',where:'Amsterdam',date:'Voorbeeld',desc:'Een film die nog even blijft hangen, met ruimte voor gesprek achteraf.'},
{id:'k1',cat:'Klassiek',emoji:'🎻',title:'Kamermuziek van dichtbij',where:'Amsterdam',date:'Voorbeeld',desc:'Een toegankelijke avond met klassieke muziek in een kleine zaal.'},
{id:'l1',cat:'Debat',emoji:'🎤',title:'Een avond vol nieuwe ideeën',where:'Amsterdam',date:'Voorbeeld',desc:'Een actueel debat met verschillende perspectieven.'}];
let tips=[],category='Alles',view='all';const key='corriefay-favorites-v1';let favorites=[];try{favorites=JSON.parse(localStorage.getItem(key)||'[]')}catch(e){}
function save(){try{localStorage.setItem(key,JSON.stringify(favorites))}catch(e){alert('Opslaan niet beschikbaar in deze browser')}}
function toggle(id){favorites=favorites.includes(id)?favorites.filter(x=>x!==id):[...favorites,id];save();render()}
function setView(v){view=v;render()}
function setCat(c){category=c;view='all';render()}
function render(){const cats=['Alles',...new Set(tips.map(x=>x.cat))];document.getElementById('filters').innerHTML=cats.map(c=>'<button class="chip '+(category===c?'active':'')+'" data-cat="'+c+'">'+c+'</button>').join('');document.querySelectorAll('[data-cat]').forEach(b=>b.onclick=()=>setCat(b.dataset.cat));let visible=tips.filter(x=>(category==='Alles'||x.cat===category)&&(view!=='saved'||favorites.includes(x.id)));document.getElementById('cards').innerHTML=visible.length?visible.map(x=>'<article class="card"><div class="art">'+x.emoji+'</div><div class="inner"><div class="top"><span class="tag">'+x.cat+' · '+x.where+'</span><button class="heart '+(favorites.includes(x.id)?'on':'')+'" data-id="'+x.id+'" aria-label="Bewaar tip">'+(favorites.includes(x.id)?'♥':'♡')+'</button></div><h2>'+x.title+'</h2><small>'+x.date+'</small><p>'+x.desc+'</p><span class="muted">Ticketlink volgt bij echte evenementen</span></div></article>').join(''):'<p>Hier staan nog geen tips. Bewaar een tip met het hartje.</p>';document.querySelectorAll('[data-id]').forEach(b=>b.onclick=()=>toggle(b.dataset.id))}
fetch('./events.json',{cache:'no-store'}).then(r=>{if(!r.ok)throw Error('Feed niet beschikbaar');return r.json()}).then(d=>{tips=d.events;render()}).catch(e=>{document.getElementById('cards').textContent='De cultuurfeed kon niet worden geladen. Probeer de pagina opnieuw te openen.';console.error(e)});
</script></body></html>
